name: Build Pani Puri Business V13 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V13 ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname 'Pani_Puri_Business_V13*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "V13 ZIP not found."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi
          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract V13 project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q "${{ steps.find_zip.outputs.zip }}" -d android-project

          # If ZIP contains one top-level V13 folder, flatten it.
          if [ -d "android-project/Pani_Puri_Business_V13" ]; then
            shopt -s dotglob
            mv android-project/Pani_Puri_Business_V13/* android-project/ || true
            rmdir android-project/Pani_Puri_Business_V13 || true
          fi

          echo "Extracted project:"
          find android-project -maxdepth 2 -type f | sort | head -100

      - name: Verify Android project
        shell: bash
        run: |
          test -f android-project/settings.gradle || test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle || test -f android-project/app/build.gradle.kts

      - name: Build Debug APK
        working-directory: android-project
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found."
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V13-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
