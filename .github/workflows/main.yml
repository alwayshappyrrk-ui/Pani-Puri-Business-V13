name: Build Pani Puri Business V13 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V13 ZIP
        id: find_zip
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname 'Pani_Puri_Business_V13*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V13 ZIP not found."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract V13 project
        id: extract
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d android-project

          PROJECT_DIR=$(find android-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found inside ZIP."
            find android-project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: locate_apk
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "${{ env.PROJECT_DIR }}" \
            -type f -name '*.apk' -print

          APK=$(find "${{ env.PROJECT_DIR }}" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Gradle succeeded but no APK file was found."

            echo "Build output directories:"
            find "${{ env.PROJECT_DIR }}" \
              -type d -path '*/build/outputs/*' -print

            exit 1
          fi

          echo "Found APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V13-APK
          path: ${{ steps.locate_apk.outputs.apk }}
          if-no-files-found: error
