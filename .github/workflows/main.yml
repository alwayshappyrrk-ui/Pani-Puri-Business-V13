name: Build Pani Puri Business V14 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Find V14 ZIP
      - name: Find V14 ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -iname 'Pani_Puri_Business_V14*.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V14 ZIP not found."
            echo "Files available:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # 5. Extract V14 project
      - name: Extract V14 project
        id: extract
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "${{ steps.find_zip.outputs.zip }}" \
            -d android-project

          PROJECT_DIR=$(find android-project \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            find android-project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # 6. Enable AndroidX
      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

      # 7. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace

          fi

      # 8. Find generated APK
      - name: Locate APK
        id: locate_apk
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "${{ env.PROJECT_DIR }}" \
            -type f \
            -name '*.apk' \
            -print

          APK=$(find "${{ env.PROJECT_DIR }}" \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not found."

            echo "Build output directories:"

            find "${{ env.PROJECT_DIR }}" \
              -type d \
              -path '*/build/outputs/*' \
              -print

            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # 9. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14-APK
          path: ${{ steps.locate_apk.outputs.apk }}
          if-no-files-found: error
